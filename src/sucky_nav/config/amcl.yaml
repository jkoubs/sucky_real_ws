amcl:
  ros__parameters:
    use_sim_time: false
    # pick ONE of these two, based on your drive
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # robot_model_type: "nav2_amcl::OmnidirectionalMotionModel"

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    tf_broadcast: true
    transform_tolerance: 0.3

    # Odometry noise (bump up if slip/poor odom)
    alpha1: 0.25
    alpha2: 0.25
    alpha3: 0.25
    alpha4: 0.25

    # Laser model
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    z_hit: 0.8
    z_short: 0.1
    z_max: 0.05
    z_rand: 0.05
    max_beams: 60

    # Beam skipping for bad readings
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001

    # Update pacing
    update_min_d: 0.2
    update_min_a: 0.2

    save_pose_rate: 0.5
    scan_topic: scan
