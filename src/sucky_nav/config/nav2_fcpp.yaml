planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0  # Expected frequency of the planner in Hz. Default: 20.0
    use_sim_time: false  # Use simulation time (true) or real time (false). Default: false
    planner_plugins: ["SpiralSTC"]  # List of planner plugins. Default: ["GridBased"]
    tf_buffer_duration: 30.0  # Duration to buffer transforms in seconds. Default: 10.0
